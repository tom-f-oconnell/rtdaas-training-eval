[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdaas-training-eval"
version = "0.1.0"
description = "Predict surgical operator skill from JIGSAWS data served by robot-telemetry-daas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rtdaas-training-eval = "training_eval.cli:main"

[tool.setuptools.packages.find]
include = ["training_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running API at RTDAAS_API_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
